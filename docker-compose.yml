# git clone, then `docker compose up -d --build`, then http://localhost:3030.
#
# There is nothing to configure first and nothing to fill in: the databases are
# created on the first boot, the network is seeded from your own routing table,
# and the secret Rails needs is generated into the storage volume rather than
# asked of you. See bin/docker-entrypoint for what happens on the way up.
name: uplink

services:
  uplink:
    build: .
    image: uplink
    container_name: uplink

    # The container is the service here, so it is the container that comes back
    # after a reboot. Do not also `systemctl --user enable uplink` — two copies
    # of Uplink would race for port 3030 and one of them would lose.
    restart: unless-stopped

    # The whole of Uplink's security rests on being reachable only from this
    # machine, so this is the one line in the file that is not a convenience.
    #
    # Sharing the host's network namespace makes the loopback the app binds to
    # the same loopback you browse from, which keeps three things true that a
    # published port would each have broken. Puma still binds 127.0.0.1, so the
    # app is no more reachable from the LAN than it was before. The theme-set
    # hook's POST still arrives from 127.0.0.1 with no X-Forwarded-For, which
    # is the only credential that endpoint has. And the probes still see your
    # network rather than a bridge — an ICMP probe of your router from inside
    # a NAT of Docker's own devising measures Docker.
    network_mode: host

    environment:
      # Uplink reads the desktop from under $HOME, and the mounts below put it
      # at the path it has on your machine rather than at the container user's
      # own home. That is not tidiness:
      # ~/.local/state/omarchy/current/background is an absolute symlink into
      # the staged theme, so mounted anywhere else it points at a path that
      # does not exist in here, realpath gives up, and the canvas comes up with
      # the right palette and no wallpaper — which reads as a styling bug
      # rather than as a mount.
      #
      # Which is why this reads UPLINK_HOME rather than HOME, and why .env
      # exists. Omarchy leaves you out of the docker group by default and
      # prompts for the daemon instead, so this is normally started under sudo
      # — and sudo is entitled to rewrite HOME. `always_set_home` in sudoers
      # does exactly that, and even passing `HOME=$HOME` on the command line
      # needs a permission the policy may not grant. Under sudo, then, ${HOME}
      # here can become /root, both mounts land on root's home, the container
      # user cannot read a byte of it, and Uplink answers /up while returning
      # 500 for every page that draws the layout.
      #
      # UPLINK_HOME is a name sudo has never heard of, so it is never in the
      # environment to be rewritten, and Compose falls back to reading it out
      # of .env in this directory — which is found the same way no matter who
      # invokes the command. Run it as yourself and HOME still answers, because
      # nothing sets UPLINK_HOME in that case either.
      HOME: ${UPLINK_HOME:-${HOME}}

    volumes:
      # Your network, the job queue, the cache and the cable. `docker compose
      # down -v` is the one command that forgets them.
      - storage:/rails/storage

      # The desktop, read-only, and only as much of it as the app reads: the
      # palette Omarchy rendered from omarchy/uplink.css.tpl, the theme's name,
      # the background the wallpaper follows, and the dashboard service list
      # the first seed borrows from. Switching themes repaints an open tab
      # through these, the same as a native install does.
      #
      # On a machine with no Omarchy, delete both lines — Uplink falls back to
      # its own palette and says so on the page. Left in place they cost you
      # two empty directories, which Docker creates rather than failing.
      - ${UPLINK_HOME:-${HOME}}/.local/state/omarchy:${UPLINK_HOME:-${HOME}}/.local/state/omarchy:ro
      - ${UPLINK_HOME:-${HOME}}/.config/omarchy:${UPLINK_HOME:-${HOME}}/.config/omarchy:ro

      # The fonts, so `Omarchy.font` can name the family the desktop actually
      # chose rather than falling back to the word "monospace". The files, and
      # the one config file that is yours rather than fontconfig's own.
      #
      # Not the whole of /etc/fonts, which was the first thing tried and was
      # wrong. Arch runs fontconfig 2.18 and ships conf.d files written for it —
      # 48-guessfamily.conf uses `genericfamily` and `xsi:nil`, both 2.18 — and
      # the library reading them in here is Debian's, which is older and does
      # not know either. It resolved the font correctly and complained about
      # every one of those lines while doing it. Handing a library a config
      # from a newer version of itself is not a mount you can get right; the
      # answer is not to.
      #
      # So the container keeps its own base config, matched to its own
      # fontconfig, and takes exactly the file omarchy writes your choice into.
      # That one is plain `match`/`edit`/`alias` with nothing version-specific
      # in it, which is why it travels and the rest does not.
      #
      # This changes the name and not the picture. The browser is on the host,
      # so the ui-monospace further down the font stack was already resolving
      # to the same face; what was wrong was the stylesheet saying otherwise.
      - /usr/share/fonts:/usr/share/fonts:ro
      - /etc/fonts/conf.d/50-omarchy.conf:/etc/fonts/conf.d/50-omarchy.conf:ro

    # /up is Rails' own health endpoint, and production.rb keeps it out of the
    # log so this does not write a line every thirty seconds forever.
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3030/up" ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  storage:
